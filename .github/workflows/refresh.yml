# Weekly data refresh: rebuild data/out/ from the latest PriceCatcher files, check it against the
# last committed build, and commit it only if every gate passes. Vercel redeploys on the push.
name: Weekly data refresh

on:
  schedule:
    # Tuesdays 00:23 UTC = 08:23 Malaysia time (UTC+8). Off the hour on purpose: GitHub delays or
    # drops scheduled jobs at :00 when load peaks. Tuesday gives Monday's big survey round a day to land.
    - cron: "23 0 * * 2"
  workflow_dispatch: # manual "Run workflow" button

# The job commits data/out/ back to the repo.
permissions:
  contents: write

# Never two refreshes at once (a manual run during the scheduled one): they'd race on the push.
# Queue instead of cancelling, so a half-finished run is never killed mid-commit.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # pipeline ~2 min + web checks ~5 min, with room for slow downloads
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # tomllib (stdlib) and the version the pipeline is developed on
          cache: pip # keyed on requirements.txt: duckdb isn't re-downloaded every week

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The gates compare against the last *committed* build, so save it before the pipeline overwrites it.
      - name: Save last committed manifest
        run: git show HEAD:data/out/manifest.json > "$RUNNER_TEMP/manifest.prev.json" || true

      - name: Build data (download + transform + export)
        run: python -m pipeline

      - name: Tests on the new output
        run: python -m pytest -q tests

      # A source that stalled but is under stale_days old sets stalled=true and passes with a warning:
      # nothing new to publish, so the steps below are skipped. At stale_days old it fails instead.
      - name: Sanity gates (stalled source, row drop, missing districts)
        id: gates
        run: python -m pipeline.gates "$RUNNER_TEMP/manifest.prev.json" data/out

      # The site must still build and lay out on the new data (new long item names, new districts)
      # before it reaches main: Vercel deploys whatever the bot pushes, and bot pushes don't trigger CI.
      - name: Web checks on the new data
        if: steps.gates.outputs.stalled != 'true'
        uses: ./.github/actions/web-checks # shared with ci.yml

      - name: Commit and push if the data changed
        if: steps.gates.outputs.stalled != 'true'
        run: |
          # The bot owns data/out/ only. Anything else changed means a step wrote outside it (e.g. into
          # your hand-edited data/item_names_en.csv): stop rather than rebase over it or lose it.
          dirty=$(git status --porcelain --untracked-files=all -- . ':!data/out')
          if [ -n "$dirty" ]; then
            echo "::error::Refresh changed files outside data/out/:"
            echo "$dirty"
            exit 1
          fi
          git add data/out
          # manifest.json changes on every build (built_at), so it alone doesn't count as a change.
          if git diff --cached --quiet -- data/out ':!data/out/manifest.json'; then
            echo "data/out/ unchanged apart from the manifest: nothing to commit."
            exit 0
          fi
          start=$(python -c "import json; print(json.load(open('data/out/manifest.json'))['window']['start'])")
          end=$(python -c "import json; print(json.load(open('data/out/manifest.json'))['window']['end'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: weekly refresh (window ${start} to ${end})"
          # Someone may have pushed while this ran: replay our data commit on top rather than fail.
          # The tree is clean apart from this commit (checked above), so a plain rebase works.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
