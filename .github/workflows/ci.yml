# CI: the pipeline's tests and the web app's checks on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result irrelevant: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests check the committed data/out/ (and the gates on synthetic manifests): no download needed.
      - run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26" # what the app is developed and tested on
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci # exact versions from the lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Build
        run: npm run build # prebuild copies ../data/out into public/data

      # check:mobile drives headless Chrome over the DevTools Protocol. setup-chrome installs a
      # pinned stable Chrome plus its Linux libraries and gives us the binary path; the script
      # reads it from CHROME and, because CI is set, adds --no-sandbox (Ubuntu 24.04's AppArmor
      # blocks Chrome's sandbox on GitHub runners; the page is our own localhost build).
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Layout check (360px and 1024px)
        id: mobile
        run: npm run check:mobile
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload layout screenshots
        if: failure() && steps.mobile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-check-screenshots
          path: web/mobile-check-out/
          retention-days: 14
