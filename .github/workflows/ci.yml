# CI: the pipeline's tests and the web app's checks on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result irrelevant: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests check the committed data/out/ (and the gates on synthetic manifests): no download needed.
      - run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-checks # shared with refresh.yml
